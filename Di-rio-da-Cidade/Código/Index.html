<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titulo.index">Diário da Cidade - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #dcdcdc;
            color: #333333;
        }
        header {
            background: black;
            color: red;
            text-align: center;
            padding: 15px;
            font-size: 1.5em;
            font-weight: bold;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 0.6em;
            color: white;
            font-style: italic;
            font-weight: normal;
        }
        .container {
            padding: 15px;
            max-width: 400px;
            margin: 40px auto;
        }
        .painel-login {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #222;
        }
        .btn-cadastro {
            background: #555;
        }
        .btn-cadastro:hover {
            background: #333;
        }
        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }
        .links-centro {
            text-align: center;
            font-size: 0.9em;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.85em;
            color: #666;
        }
        footer a {
            color: #333;
            text-decoration: underline;
            margin: 0 5px;
        }
    </style>

    <link rel="stylesheet" href="global.css">
    <script src="global.js"></script>
</head>
<body>

    <header>
        <div data-i18n="marca.titulo">DIÁRIO DA CIDADE - Barra do Garças - MT</div>
        <p data-i18n="index.slogan">Sua cidade, sua voz.</p>
    </header>

    <div class="container">
        <div class="painel-login">
            <h2 data-i18n="index.titulo">Acesse sua Conta</h2>

            <label data-i18n="index.email">E-mail:</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                data-i18n-placeholder="index.email.placeholder"
            >

            <label data-i18n="index.senha">Senha:</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                data-i18n-placeholder="index.senha.placeholder"
            >

            <button
                onclick="fazerLogin()"
                data-i18n="index.entrar"
            >
                Entrar
            </button>

            <hr>

            <div class="links-centro">
                <p data-i18n="index.semAcesso">Ainda não tem acesso?</p>
                <button
                    class="btn-cadastro"
                    onclick="window.location.href='cadastrar.html'"
                    data-i18n="index.criarConta"
                >
                    Criar Nova Conta
                </button>
            </div>
        </div>

        <footer>
            <a href="Termos de Uso.html" data-i18n="index.termos">Termos de Uso</a> |
            <a href="#" data-i18n="index.privacidade">Privacidade</a>
            <p><b data-i18n="index.copyright">© 2026 Diário da Cidade - Oficial</b></p>
            <p><b data-i18n="index.avisoTermos">Ao acessar o site estou ciente dos termos de uso</b></p>
        </footer>
    </div>

    <script>
        function fazerLogin() {
            let email = document.getElementById('email').value;
            let senha = document.getElementById('senha').value;

            let emailSalvo = localStorage.getItem('email');
            let senhaSalva = localStorage.getItem('senha');

            if (email === emailSalvo && senha === senhaSalva) {
                window.location.href = 'Principal.html';
            } else {
                alert(
                    window.dgT
                        ? window.dgT('index.erroLogin')
                        : '❌ E-mail ou senha incorretos!'
                );
            }
        }
    </script>

</body>
</html>
