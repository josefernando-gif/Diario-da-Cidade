<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário da Cidade - Login</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #dcdcdc; /* O mesmo cinza do mapa */
            color: #333333;
        }
        header {
            background: black;
            color: red;
            text-align: center;
            padding: 15px;
            font-size: 1.5em;
            font-weight: bold;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 0.6em;
            color: white;
            font-style: italic;
            font-weight: normal;
        }
        .container {
            padding: 15px;
            max-width: 400px; /* Tamanho ideal para tela de login */
            margin: 40px auto;
        }
        .painel-login {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #222;
        }
        .btn-cadastro {
            background: #555; /* Cor diferenciada para o botão de criar conta */
        }
        .btn-cadastro:hover {
            background: #333;
        }
        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }
        .links-centro {
            text-align: center;
            font-size: 0.9em;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.85em;
            color: #666;
        }
        footer a {
            color: #333;
            text-decoration: underline;
            margin: 0 5px;
        }
    </style>
</head>
<body>

    <header>
        DIÁRIO DA CIDADE - Barra do Garças - MT
        <p>Sua cidade, sua voz.</p>
    </header>

    <div class="container">
        <div class="painel-login">
            <h2>Acesse sua Conta</h2>
            
            <label>E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label>Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <!-- BOTÃO LOGIN -->
            <button onclick="fazerLogin()">Entrar</button>

            <hr>
            
            <div class="links-centro">
                <p>Ainda não tem acesso?</p>
                <!-- BOTÃO CADASTRO -->
                <button class="btn-cadastro" onclick="window.location.href='cadastrar.html'">
                    Criar Nova Conta
                </button>
            </div>
        </div>

        <footer>
            <a href="#">Termos de Uso</a> | <a href="#">Privacidade</a>
            <p><b>© 2026 Diário da Cidade - Oficial</b></p>
        </footer>
    </div>

    <script>
        function fazerLogin() {
            let email = document.getElementById('email').value;
            let senha = document.getElementById('senha').value;

            let emailSalvo = localStorage.getItem('email');
            let senhaSalva = localStorage.getItem('senha');

            if(email === emailSalvo && senha === senhaSalva){
                // Redireciona para a tela do mapa (ajuste o nome do arquivo se necessário)
                window.location.href = 'Index.html';
            } else {
                alert('❌ E-mail ou senha incorretos!');
            }
        }
    </script>

</body>
</html>
